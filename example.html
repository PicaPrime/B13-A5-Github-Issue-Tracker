<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    
</head>
<body>
    




<!-- DaisyUI Modal Component -->
<!-- Adding 'backdrop-blur-sm' blurs the background content when open -->
<dialog id="issue_modal" class="modal backdrop-blur-sm">
  <div class="modal-box max-w-lg">
    <!-- Header with status tags & 'X' button -->
    <div class="flex items-start justify-between border-b border-slate-100 pb-3">
      <div class="flex items-center gap-2">
        <span id="modal-status" class="badge badge-success text-white">Open</span>
        <span id="modal-priority" class="badge badge-error text-white">HIGH</span>
      </div>

      <!-- Close 'X' Button using DaisyUI form method="dialog" -->
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost">✕</button>
      </form>
    </div>

    <!-- Dynamic Content Body -->
    <div class="py-4">
      <h3 id="modal-title" class="text-lg font-bold text-slate-800">Title goes here</h3>
      <p id="modal-desc" class="mt-2 text-sm text-slate-600 leading-relaxed">Description goes here</p>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-action border-t border-slate-100 pt-3 flex justify-between items-center">
      <span id="modal-meta" class="text-xs text-slate-400">#1 by john_doe</span>
      <form method="dialog">
        <button class="btn btn-sm">Close</button>
      </form>
    </div>
  </div>

  <!-- DaisyUI Backdrop: Clicking anywhere outside the box closes the modal -->
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>


<article 
  class="issue-card cursor-pointer rounded-md border border-slate-200 border-t-[3px] border-t-emerald-500 bg-white shadow-sm transition hover:shadow-md"
  data-title="Fix Navigation Menu On Mobile Devices"
  data-desc="The navigation menu doesn't collapse properly on mobile devices. When toggling the hamburger button, the menu container overflows horizontally and blocks user interaction."
  data-status="Open"
  data-priority="HIGH"
  data-meta="#1 by john_doe • 1/15/2024">
  
  <div class="p-4">
    <h2 class="text-[14px] font-bold leading-5">Fix Navigation Menu On Mobile<br>Devices</h2>
    <p class="mt-2 text-xs leading-4 text-slate-500">The navigation menu doesn't collapse properly...</p>
  </div>
</article>

<script src="example.js"></script>
</body>
</html>
