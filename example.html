<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body>
    


    <!-- TAB BUTTONS CONTAINER -->
<nav class="mb-4 rounded-xl bg-white p-6 shadow-[0_2px_7px_rgba(15,23,42,.08)]">
  <div role="tablist" class="flex gap-2">
    <!-- Active by default -->
    <button 
      type="button" 
      role="tab"
      aria-selected="true"
      data-tab="all" 
      class="tab-btn h-10 min-w-28 rounded-md bg-[#4b00ff] text-[16px] font-semibold text-white">
      All
    </button>

    <!-- Inactive tabs -->
    <button 
      type="button" 
      role="tab"
      aria-selected="false"
      data-tab="open" 
      class="tab-btn h-10 min-w-28 rounded-md border border-slate-200 bg-white text-[16px] font-medium text-slate-500">
      Open
    </button>

    <button 
      type="button" 
      role="tab"
      aria-selected="false"
      data-tab="closed" 
      class="tab-btn h-10 min-w-28 rounded-md border border-slate-200 bg-white text-[16px] font-medium text-slate-500">
      Closed
    </button>
  </div>
</nav>

<!-- ISSUE CARDS GRID -->
<div id="issues-grid" class="grid grid-cols-1 gap-3 p-6 sm:grid-cols-2 lg:grid-cols-4">
  
  <!-- Example: Open Card -->
  <article data-status="open" class="issue-card rounded-md border border-slate-200 border-t-[3px] border-t-emerald-500 bg-white shadow-sm">
    <div class="p-4">
      <span class="text-xs font-semibold text-emerald-600">OPEN</span>
      <h2 class="text-sm font-bold mt-1">Fix Navigation Menu</h2>
      <p class="text-xs text-slate-500 mt-2">Menu fails on mobile...</p>
    </div>
  </article>

  <!-- Example: Closed Card -->
  <article data-status="closed" class="issue-card rounded-md border border-violet-200 border-t-[3px] border-t-purple-500 bg-white shadow-sm">
    <div class="p-4">
      <span class="text-xs font-semibold text-purple-600">CLOSED</span>
      <h2 class="text-sm font-bold mt-1">Setup Tailwind Config</h2>
      <p class="text-xs text-slate-500 mt-2">Completed theme variables setup.</p>
    </div>
  </article>


  

</div>

<script src="example.js"></script>
</body>
</html>
